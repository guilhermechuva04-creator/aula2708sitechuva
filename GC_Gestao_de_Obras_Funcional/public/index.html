<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guilherme Chuva | Gestão de Obras</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-page">
<main class="page">
<section class="login-card">
<div class="brand"><div class="brand-icon">GC</div><div><h1>Guilherme Chuva</h1><span>GESTÃO DE OBRAS</span></div></div>
<div class="divider"></div>
<div class="welcome"><h2>Bem-vindo</h2><p>Entre na sua conta para acessar o sistema.</p></div>
<form id="loginForm">
<div class="input-group"><label for="login">Usuário</label><input id="login" type="text" placeholder="Digite seu usuário" autocomplete="username" required></div>
<div class="input-group"><label for="senha">Senha</label><input id="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required></div>
<div class="options"><label class="remember"><input id="remember" type="checkbox"><span>Lembrar-me</span></label><a href="#" id="forgot">Esqueci minha senha</a></div>
<div class="buttons"><button type="submit" class="enter">Entrar <span>→</span></button><button type="reset" class="cancel">Cancelar</button></div>
<div id="loginMessage" class="message"></div>
</form>
<footer><p>© 2026 Guilherme Chuva Torres de Barros</p><span>Construction Management System</span></footer>
</section>
</main>
<script src="login.js"></script>
</body>
</html>
